name: central-release
on:
  push:
    branches:
      - rel
  workflow_dispatch: {}
jobs:
  bump_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.next_version.outputs.next_version }}
      tag_exists: ${{ steps.check_tag_exists.outputs.exists }}
      latest_commit: ${{ steps.git_remote.outputs.latest_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Git Identity
        run: |-
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
      - name: Get Next Version
        id: next_version
        run: 'get_version() { npm view "$1" version 2>/dev/null || echo "0.0.0"; } && v1=$(get_version ajithapackage) && v2=$(get_version ajithapackage2) && v3=$(get_version my-service-client) && v4=$(get_version my-service-ssdk) && echo "Found versions:" && echo "ajithapackage: $v1" && echo "ajithapackage2: $v2" && echo "my-service-client: $v3" && echo "my-service-ssdk: $v4" && LATEST=$(printf "%s\n" "$v1" "$v2" "$v3" "$v4" | sort -V | tail -n1) && IFS="." read -r major minor patch <<< "$LATEST" && NEXT_VERSION="$major.$minor.$((patch + 1))" && echo "Latest version: $LATEST" && echo "Next version: $NEXT_VERSION" && echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT'
      - name: Check if version has already been tagged
        id: check_tag_exists
        run: |-
          TAG="v${{ steps.next_version.outputs.next_version }}"
          echo "Checking for tag: $TAG"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          cat $GITHUB_OUTPUT
      - name: Check for new commits
        id: git_remote
        run: |-
          echo "latest_commit=$(git ls-remote origin -h ${{ github.ref }} | cut -f1)" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
      - name: Create Git Tag
        if: steps.check_tag_exists.outputs.exists == 'false'
        run: |-
          TAG="v${{ steps.next_version.outputs.next_version }}"
          git tag "$TAG"
          git push origin "$TAG"
  release_ajithapackage:
    needs: bump_version
    if: needs.bump_version.outputs.tag_exists != 'true' && needs.bump_version.outputs.latest_commit == github.sha
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release_package.yml
    with:
      version: ${{ needs.bump_version.outputs.version }}
      package_name: ajithapackage
      package_path: src/packages/ajithapackage1
    secrets: inherit
  release_ajithapackage2:
    needs: bump_version
    if: needs.bump_version.outputs.tag_exists != 'true' && needs.bump_version.outputs.latest_commit == github.sha
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release_package.yml
    with:
      version: ${{ needs.bump_version.outputs.version }}
      package_name: ajithapackage2
      package_path: src/packages/ajithapackage2
    secrets: inherit
  release_smithy_client:
    needs: bump_version
    if: needs.bump_version.outputs.tag_exists != 'true' && needs.bump_version.outputs.latest_commit == github.sha
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release_package.yml
    with:
      version: ${{ needs.bump_version.outputs.version }}
      package_name: my-service-client
      package_path: src/packages/my-api/build/smithy/source/typescript-client-codegen
    secrets: inherit
  release_smithy_ssdk:
    needs: bump_version
    if: needs.bump_version.outputs.tag_exists != 'true' && needs.bump_version.outputs.latest_commit == github.sha
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release_package.yml
    with:
      version: ${{ needs.bump_version.outputs.version }}
      package_name: my-service-ssdk
      package_path: src/packages/my-api/build/smithy/source/typescript-ssdk-codegen
    secrets: inherit
  npm_release:
    needs:
      - bump_version
      - release_ajithapackage
      - release_ajithapackage2
      - release_smithy_client
      - release_smithy_ssdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CI: "true"
    if: needs.bump_version.outputs.tag_exists != 'true' && needs.bump_version.outputs.latest_commit == github.sha
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: List downloaded artifacts
        run: ls -la
      - name: Extract packages
        run: |-
          packages=(ajithapackage ajithapackage2 my-service-client my-service-ssdk)
          for pkg in "${packages[@]}"; do
            echo "Extracting $pkg..."
            mkdir -p "$pkg"
            tar -xzf "$pkg.tgz" -C "$pkg" --strip-components=1 || { echo "Error extracting $pkg"; exit 1; }
          done
      - name: Patch version and Remove prepack in each package
        run: |-
          version="${{ needs.bump_version.outputs.version }}"
          packages=(ajithapackage ajithapackage2 my-service-client my-service-ssdk)
          for pkg in "${packages[@]}"; do
            echo "Patching version in $pkg/package.json"
            cd "$pkg"
            jq --arg ver "$version" '.version = $ver' package.json > tmp.json && mv tmp.json package.json
            jq 'del(.scripts.prepack)' package.json > tmp.json && mv tmp.json package.json
            cat package.json | grep version
            cd ..
          done
      - name: Publish packages to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN }}
        run: |-
          version='${{ needs.bump_version.outputs.version }}'
          packages=(ajithapackage ajithapackage2 my-service-client my-service-ssdk)
          for pkg in "${packages[@]}"; do
            echo "Publishing $pkg@$version"
            cd "$pkg"
            npm publish --access public
            echo "Successfully published $pkg@$version"
            cd ..
          done
          echo "All packages published successfully"
          echo "publishing_failed=false" >> $GITHUB_OUTPUT
      - name: Finalize Release
        run: |-
          echo "All child workflows have completed successfully."
          echo "All packages are published to NPM"
  github_release:
    needs:
      - npm_release
      - bump_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CI: "true"
    if: needs.bump_version.outputs.tag_exists != 'true' && needs.bump_version.outputs.latest_commit == github.sha
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ needs.bump_version.outputs.version }}" --title "v${{ needs.bump_version.outputs.version }}" --notes "Automated release for all packages" --target $(git rev-parse HEAD) *.tgz
concurrency:
  group: release
  cancel-in-progress: false
